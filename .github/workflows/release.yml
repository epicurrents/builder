# Release an edition.
#
# Triggered by a tag of the form `<edition>-v<major>.<minor>.<patch>` (e.g.
# `eeg-v1.2.3`). Builds that edition from the packages' main branches, records a
# reproducibility manifest pinning each package's exact commit, and attaches the
# deployable edition (standalone HTML + lib + workers) plus the manifest to a
# GitHub release.
#
# Reproducibility rests on two rules enforced here: the tag must point at a commit
# on `main`, and every package is cloned from its `main` HEAD. The manifest then
# captures the exact SHAs actually built, so `npm run setup -- --manifest <file>`
# rebuilds the edition byte-for-byte later.
#
# Only PUBLIC editions are ever released here. The workflow clones the edition's
# packages from their PUBLIC repositories with no credentials — it must never
# authenticate against or clone a private repository. Two things keep it public by
# construction: a public profile (the only kind committed to this repo, and the
# only kind a CI checkout can see) may name only public packages, and any edition
# that pulls a private package lives in the gitignored profiles/local/ and is built
# locally for local use only — never published. So this workflow will only succeed
# once an edition's packages are all public.
#
# That guarantee is only as good as the `public` flags in scripts/env.mjs, which is
# what the guard reads. Keep them in step with the repositories' actual visibility.

name: Release edition

on:
  push:
    tags:
      - '*-v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Parse the tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "edition=${TAG%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#*-v}" >> "$GITHUB_OUTPUT"

      - name: Check out the builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point at a commit on main (reproducibility rule)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          # Load-bearing rather than a floor. The setup step below clones the edition's packages
          # one at a time into a checkout whose `workspaces` globs therefore match almost nothing
          # yet, and npm 10 cannot install a workspace member in that state: arborist
          # dereferences a null node and fails with `Cannot read properties of null (reading
          # 'edgesOut')`. npm 11 installs it. Node 22 ships npm 10, so lowering this breaks the
          # clone step, not the build.
          node-version: '24'

      # Every PUBLIC package, not just the edition's. The interface type-checks its whole source
      # tree, so a clone restricted to one edition leaves the other modules' imports unresolvable
      # and `vue-tsc` fails before anything is built. Restricting the clone is what `INCLUDE_MODULES`
      # exists for, and until the builder sets it from the profile, the edition is narrowed at the
      # bundle step below instead — which is what decides the artifact in any case.
      #
      # No credentials: a package marked `public: false` is skipped here rather than attempted, so
      # a private repository is never reached. What keeps a private edition from being released is
      # `loadProfile` refusing a non-public profile, and `profiles/local/` being untracked so a CI
      # checkout cannot name one.
      - name: Clone and build every public package (from main)
        run: npm run setup -- --frozen-lockfile

      - name: Build the edition and its manifest
        env:
          EPI_PROFILE: ${{ steps.tag.outputs.edition }}
          EPI_VERSION: ${{ steps.tag.outputs.version }}
        run: npm run build:release

      - name: Package the artifacts
        id: pkg
        env:
          EDITION: ${{ steps.tag.outputs.edition }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          cd "dist/${EDITION}"
          zip -r "../${EDITION}-${VERSION}.zip" .
          cp manifest.json "../${EDITION}-${VERSION}.manifest.json"

      # Pinned to a commit: a mutable tag on a third-party action is arbitrary code running with
      # `contents: write` on this repository.
      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.zip
            dist/*.manifest.json
          body: |
            **Edition:** `${{ steps.tag.outputs.edition }}`  **Version:** `${{ steps.tag.outputs.version }}`

            The `.zip` is the deployable edition — the standalone `index.html`, the embeddable `epicurrents-lib.*` library, its stylesheet and worker bundles.

            Source localisation is optional and needs a pre-computed lead field, which is deliberately not in this `.zip`: it is close to incompressible and most deployments do not serve it. To enable the feature, take the `leadfields-*.zip` from the lead-field release and unpack it inside the edition directory, beside `index.html`. Without it the tool reports every montage as unavailable, which is the correct state for a deployment that does not want it. See "Optional: source localisation lead fields" in the builder README.

            Reproduce this build, from the builder commit the manifest records — its committed lock file is what pins the dependency versions this edition was built against, so a different builder commit can resolve different ones:
            ```
            git clone https://github.com/epicurrents/builder && cd builder
            git checkout <builder.commit from the attached .manifest.json>
            npm run setup -- --manifest <the attached .manifest.json>
            npm run build:edition
            ```
